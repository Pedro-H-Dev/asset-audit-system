version: '3.8'

services:
  # 1. Banco de Dados Relacional - MySQL (Para Ativos, Funcionários e Departamentos)
  mysql:
    image: mysql:8.0
    container_name: asset_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: asset_audit_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Banco de Dados Não-Relacional - MongoDB (Para Logs e Auditoria JSON)
  mongodb:
    image: mongo:latest
    container_name: asset_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: audit_logs_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data: